name: Verify Project Brain

on:
  pull_request:
    branches: [main]
    paths:
      - "project-brain/**"
      - "brain/**"
      - ".github/workflows/project-brain.yml"
  push:
    branches: [main]
    paths:
      - "project-brain/**"
      - "brain/**"
      - ".github/workflows/project-brain.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate graph JSON
        run: node -e "JSON.parse(require('fs').readFileSync('project-brain/graph/project-brain.json','utf8')); console.log('graph json ok')"
      - name: Run Project Brain tests
        run: node --test project-brain/*.test.mjs
      - name: Smoke query CLI
        run: node project-brain/query.mjs providers rollback
